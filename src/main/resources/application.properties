server.port=8081

spring.application.name=ayurveda-ai-bot

# ============================================================
# OLLAMA
# ============================================================

ollama.api.url=http://localhost:11434/api/chat

ollama.model=${OLLAMA_MODEL:qwen2.5:3b-instruct}

# ============================================================
# THYMELEAF
# ============================================================

spring.thymeleaf.cache=false

spring.thymeleaf.prefix=classpath:/templates/

spring.thymeleaf.suffix=.html

# ============================================================
# LOGGING
# ============================================================

logging.level.com.ayurveda=INFO
# ============================================================
# AUTH / H2 DATABASE
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/ayurvedacare;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ============================================================
# SMTP EMAIL - set these values or environment variables
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
