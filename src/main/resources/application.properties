server.port=${PORT:8081}

spring.application.name=ayurveda-ai-bot

# ============================================================
# AI MODEL CONFIGURATION (GEMINI & GROK)
# ============================================================

# Primary AI Provider: "gemini" (free tier) or "grok"
ai.provider=${AI_PROVIDER:gemini}

# Google Gemini Free API
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}

# xAI Grok API
grok.api.key=${GROK_API_KEY:}
grok.model=${GROK_MODEL:grok-2-latest}
grok.api.url=${GROK_API_URL:https://api.x.ai/v1/chat/completions}

# ============================================================
# THYMELEAF
# ============================================================

spring.thymeleaf.cache=false

spring.thymeleaf.prefix=classpath:/templates/

spring.thymeleaf.suffix=.html

# ============================================================
# LOGGING
# ============================================================

logging.level.com.ayurveda=INFO
# ============================================================
# AUTH / H2 DATABASE
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/ayurvedacare;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ============================================================
# SMTP EMAIL - set these values or environment variables
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:abhishekdhokane1331@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
