<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account – AyurvedaCare</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><section class="auth-page"><div class="auth-card"><div class="logo auth-logo"><span class="logo-icon">🌿</span><span class="logo-text">AyurvedaCare</span></div><h1>Create your account</h1><p class="auth-subtitle">Join AyurvedaCare to save your email for personalized AI wellness communication.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/signup"><label>Full name</label><input type="text" name="name" placeholder="Your name" minlength="2" required><label>Email address</label><input type="email" name="email" placeholder="you@example.com" required><label>Password</label><input type="password" name="password" placeholder="At least 6 characters" minlength="6" required><button class="btn btn-primary auth-submit" type="submit">Sign Up</button></form><p class="auth-switch">Already have an account? <a href="/login">Login</a></p><a class="back-link" href="/">← Back to home</a></div></section></body></html>
