<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login – AyurvedaCare</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><section class="auth-page"><div class="auth-card"><div class="logo auth-logo"><span class="logo-icon">🌿</span><span class="logo-text">AyurvedaCare</span></div><h1>Welcome back</h1><p class="auth-subtitle">Sign in to ask AyurvedaCare AI questions and email your wellness information.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/login"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required><label>Password</label><input type="password" name="password" placeholder="••••••••" required><button class="btn btn-primary auth-submit" type="submit">Login</button></form><p class="auth-switch">New here? <a href="/signup">Create an account</a></p><a class="back-link" href="/">← Back to home</a></div></section></body></html>
